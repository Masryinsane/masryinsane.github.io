name: Update KodiSeerr Repo
on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight
  workflow_dispatch:    # Allows you to run it manually

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Required to save files back to your repo
    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download KodiSeerr v2.1
        run: |
          # 1. Create the plugin folder
          mkdir -p plugin.video.kodiseerr
          
          # 2. Download the specific v2.1 source archive
          echo "Downloading KodiSeerr v2.1..."
          curl -L "github.com" -o ./plugin.video.kodiseerr/plugin.video.kodiseerr.zip
          
          # 3. Verify the file exists
          if [ ! -f "./plugin.video.kodiseerr/plugin.video.kodiseerr.zip" ]; then
            echo "Error: Download failed!"
            exit 1
          fi

      - name: Run Kodi Repo Generator
        run: |
          # Ensure your script file exists in the root
          if [ -f "_repo_xml_generator.py" ]; then
            python3 _repo_xml_generator.py
          elif [ -f "_repo_generator.py" ]; then
            python3 _repo_generator.py
          else
            echo "Error: No generator script found in root!"
            exit 1
          fi

      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add .
          # Only commit if there are actual changes to the files
          git commit -m "Auto-update: Synced KodiSeerr v2.1" || exit 0
          git push
