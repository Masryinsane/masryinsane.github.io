name: Update KodiSeerr Repo
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for 2025 security standards to push changes
    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4

      - name: Download Specific KodiSeerr Release (v2.1)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Use the "tags" endpoint instead of "latest"
          RELEASE_DATA=$(curl -s -H "Authorization: token $GITHUB_TOKEN" api.github.com)
          
          # 2. Extract the download URL for the ZIP asset
          URL=$(echo "$RELEASE_DATA" | grep -oP '"browser_download_url":\s*"\K[^"]+' | head -1)
          
          # 3. Safety check
          if [ -z "$URL" ]; then
            echo "Error: Could not find download URL for tag v2.1. API response was:"
            echo "$RELEASE_DATA"
            exit 1
          fi

          echo "Downloading from: $URL"
          mkdir -p plugin.video.kodiseerr
          curl -L "$URL" -o ./plugin.video.kodiseerr/plugin.video.kodiseerr.zip


      - name: Run Kodi Repo Generator
        run: |
          if [ -f "_repo_xml_generator.py" ]; then
            python3 _repo_xml_generator.py
          else
            echo "Error: _repo_xml_generator.py not found in root!"
            exit 1
          fi

      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add .
          git commit -m "Auto-update: Synced latest KodiSeerr release" || exit 0
          git push
